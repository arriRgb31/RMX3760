name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync \
            device-tree-compiler \
            libfdt-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "arriRgb31@users.noreply.github.com"
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      # Full rombak: TWRP 12.1 stock + 4 patch (A15+UMS9230 working decrypt).
      # The 4 proven patches are applied verbatim:
      #   1. graphics_drm.cpp  -> minuitwrp (legacy DRM API, fix black screen)
      #   2. libcxx_verbose_abort.patch -> external/libcxx (A15 NDK libc++ ABI)
      #   3. vold_android15_keyblob.patch -> system/vold (KeyMint key-blob upgrade)
      #   4. vold_recovery_fscrypt_keyring.patch -> system/vold (fscrypt keyring)
      # No superbackup/, no crypto/, no servicemanager_patch: stock TWRP 12.1
      # source + these patches only.

      - name: Patch minuitwrp graphics_drm.cpp (legacy API, fix black screen)
        run: |
          cp workspace/device/realme/RMX3760/patch/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp
          echo "graphics_drm.cpp replaced (legacy API)"

      - name: Patch external/libcxx (export __libcpp_verbose_abort for A15 NDK libs)
        run: |
          cd workspace
          patch -p1 < device/realme/RMX3760/patch/libcxx_verbose_abort.patch
          echo "external/libcxx patched (__libcpp_verbose_abort)"

      - name: Patch system/vold (Android 15 keyblob upgrade)
        run: |
          cd workspace
          patch -p1 < device/realme/RMX3760/patch/vold_android15_keyblob.patch
          echo "system/vold patched (KeyMint key-blob upgrade)"

      - name: Patch system/vold (recovery fscrypt keyring)
        run: |
          cd workspace
          patch -p1 < device/realme/RMX3760/patch/vold_recovery_fscrypt_keyring.patch
          echo "system/vold patched (fscrypt keyring)"

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      # NOTE: do NOT bake DTBO overlay into dtb.img here.
      # Bootloader merges stock dtbo (dtbo_idx=15, see bootconfig) itself at boot.

      - name: Build Recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          rm -rf out
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          mka vendorbootimage -j$(nproc)

      - name: Collect Images
        run: |
          mkdir -p workspace/output
          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760
          path: workspace/output/*.img