name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync \
            device-tree-compiler \
            libfdt-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "arriRgb31@users.noreply.github.com"
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Patch minuitwrp graphics_drm.cpp (atomic -> legacy, fix black screen)
        run: |
          cp workspace/device/realme/RMX3760/issue_atomic/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp
          echo "graphics_drm.cpp replaced (legacy API, ref TWRP manifest issue #67)"

      - name: Patch partition.cpp + partitionmanager.cpp (backup/install for logical erofs)
        run: |
          cp workspace/device/realme/RMX3760/superbackup/partition.cpp \
             workspace/bootable/recovery/partition.cpp
          cp workspace/device/realme/RMX3760/superbackup/partitionmanager.cpp \
             workspace/bootable/recovery/partitionmanager.cpp
          echo "partition.cpp/partitionmanager.cpp patched (keep Can_Be_Backed_Up on Is_Super)"

      - name: "Patch action.cpp (setbootslot - route A/B via current_slot + reboot)"
        run: |
          # setbootslot currently calls HIDL IBootControl::setActiveBootSlot() which
          # writes misc/BCB, but Unisoc UMS9230 bootloader ignores misc/BCB and reads
          # the active slot from eMMC boot areas via /sys/class/block/mmcblk0/current_slot.
          # Patch: for A/B arg, set twrp.slotswitch prop (device-tree rc writes
          # current_slot + sets ro.boot.slot_suffix_ab), then reboot to system so the
          # bootloader boots the new slot. Non-A/B args keep the original HIDL path.
          cp workspace/device/realme/RMX3760/superbackup/action.cpp \
             workspace/bootable/recovery/gui/action.cpp
          echo "action.cpp patched (setbootslot: current_slot + reboot on Unisoc)"

      - name: Patch gui.cpp (wait for touch input device, remove boot touch delay)
        run: |
          # The SPI touch (omnivision_tcm) firmware loads asynchronously after the
          # module probes, so /dev/input/event* may not exist when TWRP's ev_init()
          # runs. ev_init() scans /dev/input only once, and ev_get() only re-scans
          # when the dir mtime changes (every ~2s) -> multi-second touch delay after
          # the GUI appears. The actual fix lives in minuitwrp/events.cpp (ev_init
          # blocks until a multitouch device appears); gui.cpp just calls ev_init().
          cp workspace/device/realme/RMX3760/superbackup/gui.cpp \
             workspace/bootable/recovery/gui/gui.cpp
          echo "gui.cpp patched (touch wait moved into ev_init in events.cpp)"

      - name: Patch minuitwrp events.cpp (ev_init waits for multitouch device)
        run: |
          # Block inside ev_init() until an ABS_MT touchscreen device is present in
          # /dev/input (max 15s). The Unisoc SPI touch registers ~10s after boot, so
          # without this ev_init() misses it and the first screen is frozen until
          # ev_get() rescans (every ~2s on /dev/input mtime change).
          cp workspace/device/realme/RMX3760/superbackup/events.cpp \
             workspace/bootable/recovery/minuitwrp/events.cpp
          echo "events.cpp patched (ev_init waits for multitouch device)"

      - name: Patch servicemanager.rc (per-service A15 LD_LIBRARY_PATH, GUI-safe)
        run: |
          # Base TWRP servicemanager.rc (A12.1, comes from android_bootable_recovery
          # twrp-12.1) wins the init duplicate-race and has NO A15 LD_LIBRARY_PATH, so
          # servicemanager resolves A12.1 libbinder -> CANNOT LINK ConnectionInfo ->
          # vold addService fails -> /data never unlocks. Overriding the file via
          # PRODUCT_COPY_FILES caused a base_rules.mk build conflict, and the global
          # LD_LIBRARY_PATH export hung recovery. Instead patch the source file the
          # same proven way as graphics_drm.cpp: add a per-service setenv so ONLY the
          # servicemanager process uses /system/lib64/a15 (GUI stays A12.1).
          cp workspace/device/realme/RMX3760/servicemanager_patch/servicemanager.rc \
             workspace/bootable/recovery/etc/init/servicemanager.rc
          echo "servicemanager.rc patched (per-service A15 LD_LIBRARY_PATH)"

      - name: Patch hwservicemanager/vndservicemanager.rc (A15 libvintf/libbinder, GUI-safe)
        run: |
          # DRAFT 1 (2026-09-03): the A15 keymint/keystore2/vold binaries (ICE chain)
          # speak A15 AIDL/binder. The A12.1 ramdisk hwservicemanager + vndservicemanager
          # reject them (addService IKeyMintDevice/default SIGABRT, binder wire-proto 0)
          # => /data never unlocks. Point these two managers at the A15 lib set only
          # (like servicemanager), leaving the TWRP GUI (recovery) on A12.1.
          # /system_root (stock A15 system, ro) is mounted by keymint_unisoc.rc at
          # late-init; hal_boot restarts these managers right after, so libvintf A15
          # becomes reachable. Earlier boot falls back to ramdisk A12.1 safely.
          cp workspace/device/realme/RMX3760/servicemanager_patch/hwservicemanager.rc \
             workspace/bootable/recovery/etc/init/hwservicemanager.rc
          cp workspace/device/realme/RMX3760/servicemanager_patch/vndservicemanager.rc \
             workspace/bootable/recovery/etc/init/vndservicemanager.rc
          echo "hwservicemanager.rc + vndservicemanager.rc patched (A15 lib set)"

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      # NOTE: do NOT bake DTBO overlay into dtb.img here.
      # Bootloader merges stock dtbo (dtbo_idx=15, see bootconfig) itself at boot.
      # Baking produced a double-merged FDT inside vendor_boot that broke normal
      # system boot (bootloop on slot _b) while recovery stayed tolerant.

      - name: Build Recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          rm -rf out
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          mka vendorbootimage -j$(nproc)

      - name: Collect Images
        run: |
          mkdir -p workspace/output
          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760
          path: workspace/output/*.img
