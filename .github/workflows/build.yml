name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - orangefox

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync \
            device-tree-compiler \
            libfdt-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox sources (fox_12.1)
        run: |
          mkdir -p workspace
          git clone https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
          cd OrangeFox_sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/work/RMX3760/RMX3760/workspace

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760
          ref: orangefox

      - name: Patch minuitwrp graphics_drm.cpp (atomic -> legacy, fix black screen)
        run: |
          cp workspace/device/realme/RMX3760/issue_atomic/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp
          echo "graphics_drm.cpp replaced (legacy API)"

      # NOTE: superbackup/partition.cpp + partitionmanager.cpp are NOT
      # applied here. Those patches were written for the main TWRP tree and
      # do not fit OrangeFox fox_12.1:
      #  - superbackup/partitionmanager.cpp lacks OFox's TWPartitionManager::
      #    functions (e.g. Fox_Set_Dynamic_Partition_Props, Storage_Is_Encrypted,
      #    Mount_Super_Toggle, Disable_AVB2, ...) -> undefined symbols at link.
      # OrangeFox already has built-in support for logical/erofs partitions, so
      # its own partition.cpp / partitionmanager.cpp are used as-is.

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      # NOTE: do NOT bake DTBO overlay into dtb.img here.
      # Bootloader merges stock dtbo (dtbo_idx=15, see bootconfig) itself at boot.

      - name: Build OrangeFox
        run: |
          cd workspace
          export FOX_BUILD_DEVICE=RMX3760
          export FOX_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          rm -rf out
          # OrangeFox's patched build/envsetup.sh (patch-make) sources:
          #   1) . $ANDROID_BUILD_TOP/vendor/twrp/build/envsetup.sh
          #      -> does not exist in the TWRP vendor tree; under bash -e the
          #         failing source aborts the step with no output. Stub it.
          #   2) orangefox_envsetup() runs
          #        [ -s $FOX_MANIFEST_ROOT/frameworks/base/services/core/xsd/vts/Android.mk ] \
          #          && echo -n "" > ...
          #      which returns 1 when the file is absent -> function returns 1
          #      -> aborts at top level under bash -e. Provide a non-empty file.
          mkdir -p vendor/twrp/build
          touch vendor/twrp/build/envsetup.sh
          mkdir -p frameworks/base/services/core/xsd/vts
          echo "# stub" > frameworks/base/services/core/xsd/vts/Android.mk
          # Guard only around source so the rc is visible in the log instead of
          # silently dying. Both stubs above make source return 0.
          set +e
          source build/envsetup.sh
          echo "## envsetup rc=$?"
          set -e
          lunch twrp_RMX3760-eng
          mka adbd vendorbootimage -j$(nproc)

      - name: Collect Images
        run: |
          mkdir -p workspace/output
          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/OrangeFox*.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_RMX3760
          path: workspace/output/*.img
