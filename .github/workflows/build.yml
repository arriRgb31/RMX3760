name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync \
            device-tree-compiler \
            libfdt-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Patch minuitwrp graphics_drm.cpp (atomic -> legacy, fix black screen)
        run: |
          cp workspace/device/realme/RMX3760/issue_atomic/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp
          echo "graphics_drm.cpp replaced (legacy API, ref TWRP manifest issue #67)"

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Merge DTBO into DTB (fix touch input in recovery)
        run: |
          DTB=workspace/device/realme/RMX3760/prebuilt/dtb.img
          OVERLAY=workspace/device/realme/RMX3760/prebuilt/dtbo_overlay.dtb
          HEADER_SIZE=64
          dd if="$DTB" bs=1 skip=$HEADER_SIZE of=/tmp/base_fdt.dtb
          fdtoverlay -i /tmp/base_fdt.dtb -o /tmp/merged_fdt.dtb "$OVERLAY"
          dd if="$DTB" bs=1 count=$HEADER_SIZE of=/tmp/dtb_header.bin
          cat /tmp/dtb_header.bin /tmp/merged_fdt.dtb > "$DTB"
          echo "DTBO merged: $(wc -c < "$DTB") bytes"

      - name: Build Recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          rm -rf out
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          mka vendorbootimage -j$(nproc)

      - name: Collect Images
        run: |
          mkdir -p workspace/output
          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760
          path: workspace/output/*.img
